name: Bug report
description: Something in solana-wallet-tracker gives a wrong result or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The exact command you ran and what it printed. Remove anything private.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: node 22.12.0, Ubuntu 24.04
